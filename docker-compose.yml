services:
  api:
    build:
      context: .
    container_name: openagenda-rag-api
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      INDEX_OUTPUT_DIR: /app/runtime-data/index/faiss
      INDEX_INPUT_PATH: /app/runtime-data/processed/events.parquet
    ports:
      - "8000:8000"
    volumes:
      - openagenda_runtime_data:/app/runtime-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  openagenda_runtime_data:
